[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "signalnest"
version = "0.1.0"
description = "Single-user, self-hosted campus information assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0.38,<2.1",
    "alembic>=1.15,<2",
    "httpx>=0.28.1,<0.29",
    "beautifulsoup4>=4.13,<5",
]

[project.scripts]
signalnest = "signalnest.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.uv]
prerelease = "disallow"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
