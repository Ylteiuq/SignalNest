# Query-only example, NOT a deployment or verified personal profile.
# All paths are relative to this file. Existing UC and CS instances must be initialized.
timezone = "Asia/Shanghai"
profile = "profile.cs-undergrad.example.toml"

[[instances]]
id = "uc"
config = "config.example.toml"

[[instances]]
id = "cs"
config = "config.cs.example.toml"

[limits]
max_model_calls = 6
max_requests = 8
max_tool_calls = 16
run_seconds = 90.0
max_tool_chars = 60000
notice_chunk_chars = 6000
max_read_notices = 12
results_per_source = 5

# Leave model absent for local retrieval. Uncomment only after selecting an available
